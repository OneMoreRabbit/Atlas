# TEMPLATE — copy into the VAULT repo's .github/workflows/atlas-regen.yml
# (it does nothing in the method repo; it maintains a project vault's default branch).
#
# "Components author, main generates" (AAC-method §9): derived views are committed only
# here, from merged truth — never by component PRs. Also runs nightly, so drift
# detection needs no local machine switched on.
name: atlas-regen
on:
  # run on the vault's WORK branch (the `branching:` policy in io-graph.yml) — derived
  # views reflect the merged truth of the working line; both listed so the template
  # works under the default policy (work: dev) and for trunk-only vaults (work: main).
  push: { branches: [main, dev] }
  workflow_dispatch:
  schedule: [{ cron: "17 3 * * *" }]
permissions: { contents: write }

# Serialise runs: two regens racing (a merge landing while the nightly runs) both push
# derived views to the same branch and one loses. Queue instead of cancelling — the
# later run must still produce artefacts.
concurrency:
  group: atlas-regen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the vault's method pin
        id: pin
        # The pin lives in ONE place (registry/io-graph.yml, AAC-method §5). Reading it
        # here rather than hardcoding `ref: v<pinned>` keeps it that way — a second
        # literal in a workflow is a second thing to re-pin, and it drifts silently.
        run: |
          # Read as raw text, never through a YAML loader: an unquoted 1.10 parses as
          # the float 1.1 and would check out the wrong tag (method 1.10 changelog).
          PIN=$(sed -n '/^method:/,/^[^ ]/p' registry/io-graph.yml |
                sed 's/[[:space:]]*#.*$//' |
                sed -n "s/^[[:space:]]*pinned:[[:space:]]*[\"']\{0,1\}\([0-9][0-9.]*\)[\"']\{0,1\}[[:space:]]*$/\1/p" |
                head -1)
          case "$PIN" in
            "") echo "::error::no method pin in registry/io-graph.yml"; exit 1 ;;
          esac
          # Resolve to an IMMUTABLE tag (method 1.20): a two-part pin takes the highest
          # vX.Y.* patch, a three-part pin is exact. Tags never move after release.
          ESC=$(printf '%s' "$PIN" | sed 's/\./\\./g')
          REF=$(git ls-remote --tags https://github.com/OneMoreRabbit/Atlas.git "v$PIN" "v$PIN.*" |
                sed 's|.*refs/tags/||; s|\^{}$||' | grep -E "^v${ESC}(\.[0-9]+)?$" | sort -V | tail -1)
          REF=${REF:-v$PIN}
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "vault pins method $PIN — resolved to $REF"
      - uses: actions/checkout@v4
        with:
          repository: OneMoreRabbit/Atlas
          path: .atlas-method
          ref: ${{ steps.pin.outputs.ref }}   # the vault's pin, honoured (AAC-method §9)
        # If the method repo is private, this checkout also needs a `token:` with access.
      - run: pip install -r .atlas-method/tools/requirements.txt
      - name: Configure remote-probe credentials
        env:
          # GITHUB_TOKEN addresses this private vault. A configured estate token also
          # lets --check-wiring inspect private component repos (decisions/0001).
          ATLAS_PROBE_TOKEN: ${{ secrets.ATLAS_ESTATE_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${ATLAS_PROBE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: python .atlas-method/tools/atlas_validate.py . --check-wiring
      - name: Commit derived views
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"

          stage() {
            git add registry/graph.md dashboard.md
            local component_views=(components/*/component.md)
            if [[ -e "${component_views[0]}" ]]; then
              git add "${component_views[@]}"
            fi
            # A newly seeded vault has no compiled manifests until its first component.
            # Stage the directory only when it exists or contains tracked deletions.
            if [[ -d registry/.compiled ]] || [[ -n "$(git ls-files -- registry/.compiled)" ]]; then
              git add -A -- registry/.compiled
            fi
          }

          for attempt in 1 2 3; do
            stage
            if git diff --cached --quiet; then
              echo "derived views already current — nothing to commit"; exit 0
            fi
            git commit -q -m "atlas: regenerate derived views [skip ci]"
            git push && exit 0

            # Push rejected: a commit landed on the branch while this run was working.
            # Derived views are NEVER rebased. Rebasing a generated file conflicts with
            # itself and wedges the job mid-rebase (field defect, 2026-08-28: two pushes
            # three seconds apart left dashboard.md disagreeing with io-graph.yml until
            # the nightly). A *successful* rebase would be no better — it would splice
            # two generations of a derived view together. The views are regenerated from
            # merged truth and owned by nobody, so: drop this run's commit, take whatever
            # won, and regenerate on top of it.
            echo "push rejected (attempt $attempt) — regenerating on top of the new head"
            git reset -q --hard HEAD~1
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            # Breaking drift was already gated by the validate step above; this re-run
            # exists only to produce files, so a red exit must not abort the retry.
            python .atlas-method/tools/atlas_validate.py . --check-wiring || true
          done
          echo "::error::atlas-regen could not push after 3 attempts"; exit 1
