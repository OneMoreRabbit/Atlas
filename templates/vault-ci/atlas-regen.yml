# TEMPLATE — copy into the VAULT repo's .github/workflows/atlas-regen.yml
# (it does nothing in the method repo; it maintains a project vault's default branch).
#
# "Components author, main generates" (AAC-method §9): derived views are committed only
# here, from merged truth — never by component PRs. Also runs nightly, so drift
# detection needs no local machine switched on.
name: atlas-regen
on:
  # run on the vault's WORK branch (the `branching:` policy in io-graph.yml) — derived
  # views reflect the merged truth of the working line; both listed so the template
  # works under the default policy (work: dev) and for trunk-only vaults (work: main).
  push: { branches: [main, dev] }
  workflow_dispatch:
  schedule: [{ cron: "17 3 * * *" }]
permissions: { contents: write }

# Serialise runs: two regens racing (a merge landing while the nightly runs) both push
# derived views to the same branch and one loses. Queue instead of cancelling — the
# later run must still produce artefacts.
concurrency:
  group: atlas-regen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: OneMoreRabbit/Atlas, path: .atlas-method }
        # To honour the vault's method pin exactly, add `ref: v<pinned>` here.
        # If the method repo is private, this checkout also needs a `token:` with access.
      - run: pip install -r .atlas-method/tools/requirements.txt
      - name: Configure remote-probe credentials
        env:
          # GITHUB_TOKEN addresses this private vault. A configured estate token also
          # lets --check-wiring inspect private component repos (decisions/0001).
          ATLAS_PROBE_TOKEN: ${{ secrets.ATLAS_ESTATE_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${ATLAS_PROBE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: python .atlas-method/tools/atlas_validate.py . --check-wiring
      - name: Commit derived views
        run: |
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add registry/graph.md dashboard.md
          component_views=(components/*/component.md)
          if [[ -e "${component_views[0]}" ]]; then
            git add "${component_views[@]}"
          fi
          # A newly seeded vault has no compiled manifests until its first component.
          # Stage the directory only when it exists or contains tracked deletions.
          if [[ -d registry/.compiled ]] || [[ -n "$(git ls-files -- registry/.compiled)" ]]; then
            git add -A -- registry/.compiled
          fi
          git diff --cached --quiet || git commit -m "atlas: regenerate derived views [skip ci]"
          # Rebase before pushing: a component PR can merge between checkout and push,
          # and derived views are regenerated from merged truth, not owned by this run.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            git push && exit 0
            echo "push rejected (attempt $attempt) — refetching"
          done
          echo "::error::atlas-regen could not push after 3 attempts"; exit 1
