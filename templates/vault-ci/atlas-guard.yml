# TEMPLATE — copy into the VAULT repo's .github/workflows/atlas-guard.yml
# (it does nothing in the method repo; it guards a project vault's PRs).
#
# Enforces AAC-method §9's write model: a PR from branch atlas/<slug>/<topic> may touch
# only that component's outbox paths, and any io-graph.yml edit must concern the slug's
# own entries. Pair with atlas-regen.yml on the default branch.
#
# Merge policy (AAC-method §9, "ceremony follows path"): PRs touching only
# components/<slug>/** should auto-merge once both jobs pass (e.g. enable repo
# auto-merge and run `gh pr merge --auto`); PRs touching architecture/proposals/**
# or registry/io-graph.yml wait for the architecture session's review.
name: atlas-guard
on: pull_request

jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # The branch policy is declared (§9); enforce it on the PR's base too. Field
      # evidence: two component PRs targeted `release` before this existed, and the
      # guard passed them — it checked the head branch's shape but never the base.
      - name: Enforce base branch (ADR-0002 / ADR-0006)
        run: |
          # Read the DECLARED policy (§9) — never assume dev/main. A trunk-only vault
          # declares `work: main` and no release branch, and must still pass.
          pol() { sed -n '/^branching:/,/^[^ ]/p' registry/io-graph.yml |
                  sed 's/[[:space:]]*#.*$//' |
                  sed -n "s/^[[:space:]]*$1:[[:space:]]*[\"']\{0,1\}\([A-Za-z0-9._\/-]*\)[\"']\{0,1\}[[:space:]]*$/\1/p" |
                  head -1; }
          WORK=$(pol work); RELEASE=$(pol release)
          [ -n "$WORK" ] || { echo "::error::could not parse branching.work from registry/io-graph.yml (present but unreadable, or absent)"; exit 1; }
          BASE="${{ github.base_ref }}"; HEAD="${{ github.head_ref }}"
          if [ -n "$RELEASE" ] && [ "$BASE" = "$RELEASE" ] && [ "$HEAD" = "$WORK" ]; then
            echo "release merge ($WORK -> $RELEASE): arch-reviewed by definition, scope checks skipped"
            echo "RELEASE_MERGE=1" >> "$GITHUB_ENV"
          elif [ "$BASE" != "$WORK" ]; then
            echo "::error::PRs must target the work branch '$WORK'; '$RELEASE' takes only $WORK -> $RELEASE release merges"
            exit 1
          fi

      - name: Enforce outbox scope (golden rule 2)
        run: |
          [ "$RELEASE_MERGE" = "1" ] && { echo "release merge — skipping outbox scope"; exit 0; }
          BR="${{ github.head_ref }}"
          case "$BR" in
            atlas/*/*) SLUG=$(echo "$BR" | cut -d/ -f2) ;;
            *) echo "::error::branch must be atlas/<slug>/<topic>"; exit 1 ;;
          esac
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          FAIL=0
          while IFS= read -r f; do
            case "$f" in
              "components/$SLUG"/*) ;;                # own subtree — the outbox
              architecture/proposals/*) ;;            # additive ADRs, status: proposed
              registry/io-graph.yml) ;;               # ownership checked below
              *) echo "::error file=$f::$SLUG may not write $f"; FAIL=1 ;;
            esac
          done < /tmp/changed.txt                     # redirect, not a pipe: FAIL survives
          exit $FAIL

      - name: Edge ownership — io-graph.yml edits must name the slug
        run: |
          [ "$RELEASE_MERGE" = "1" ] && { echo "release merge — skipping edge ownership"; exit 0; }
          git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- registry/io-graph.yml && exit 0
          pip install -q PyYAML
          git show "origin/${{ github.base_ref }}:registry/io-graph.yml" > /tmp/base.yml
          python - "$SLUG" <<'PYEOF'
          import sys, yaml
          slug = sys.argv[1]

          def entries(path, key):
              g = yaml.safe_load(open(path)) or {}
              return {frozenset((k, str(v)) for k, v in d.items()) for d in g.get(key, [])}

          bad = []
          # method: and external: are architecture-owned, like architecture/** — a
          # component branch once carried a method re-pin and the guard admitted it,
          # because it only diffed `edges` and `components`.
          def arch_owned(path, key):
              return (yaml.safe_load(open(path)) or {}).get(key)
          for key in ("method", "external"):
              if arch_owned("registry/io-graph.yml", key) != arch_owned("/tmp/base.yml", key):
                  bad.append((key, {"note": f"{key} is architecture-owned; raise via architecture/proposals/"}))
          for key, owns in (("edges", lambda d: slug in (d.get("from"), d.get("to"))),
                            ("components", lambda d: d.get("slug") == slug)):
              for e in entries("registry/io-graph.yml", key) ^ entries("/tmp/base.yml", key):
                  d = dict(e)
                  if not owns(d):
                      bad.append((key, d))
          for key, d in bad:
              print(f"::error file=registry/io-graph.yml::{slug} changed a {key} entry it does not own: {d}")
          sys.exit(1 if bad else 0)
          PYEOF

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the vault's method pin
        id: pin
        # The pin lives in ONE place (registry/io-graph.yml, AAC-method §5). Reading it
        # here rather than hardcoding `ref: v<pinned>` keeps it that way — a second
        # literal in a workflow is a second thing to re-pin, and it drifts silently.
        run: |
          # Read as raw text, never through a YAML loader: an unquoted 1.10 parses as
          # the float 1.1 and would check out the wrong tag (method 1.10 changelog).
          PIN=$(sed -n '/^method:/,/^[^ ]/p' registry/io-graph.yml |
                sed 's/[[:space:]]*#.*$//' |
                sed -n "s/^[[:space:]]*pinned:[[:space:]]*[\"']\{0,1\}\([0-9][0-9.]*\)[\"']\{0,1\}[[:space:]]*$/\1/p" |
                head -1)
          case "$PIN" in
            "") echo "::error::no method pin in registry/io-graph.yml"; exit 1 ;;
          esac
          # Resolve to an IMMUTABLE tag (method 1.20): a two-part pin takes the highest
          # vX.Y.* patch, a three-part pin is exact. Tags never move after release.
          ESC=$(printf '%s' "$PIN" | sed 's/\./\\./g')
          REF=$(git ls-remote --tags https://github.com/OneMoreRabbit/Atlas.git "v$PIN" "v$PIN.*" |
                sed 's|.*refs/tags/||; s|\^{}$||' | grep -E "^v${ESC}(\.[0-9]+)?$" | sort -V | tail -1)
          REF=${REF:-v$PIN}
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "vault pins method $PIN — resolved to $REF"
      - uses: actions/checkout@v4
        with:
          repository: OneMoreRabbit/Atlas
          path: .atlas-method
          ref: ${{ steps.pin.outputs.ref }}   # the vault's pin, honoured (AAC-method §9)
        # If the method repo is private, this checkout also needs a `token:` with access.
      - run: pip install -r .atlas-method/tools/requirements.txt
      - run: python .atlas-method/tools/atlas_validate.py .   # check only; exit 1 blocks merge
      - name: Roadmap timeline is current
        # Checked, not regenerated: the block derives from the same file a human just
        # edited, so having CI rewrite it would race the author (method 1.19). Skipped
        # entirely when the vault has no roadmap — it is standard, never required.
        run: |
          if [ -f roadmap.md ] && [ -f meta/roadmap_timeline.py ]; then
            python3 meta/roadmap_timeline.py --check
          else
            echo "no roadmap.md — skipping"
          fi
